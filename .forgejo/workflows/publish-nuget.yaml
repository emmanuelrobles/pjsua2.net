name: Publish NuGet to nuget.org

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for manual runs)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: docker

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          submodules: recursive

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config swig libssl-dev \
            g++-aarch64-linux-gnu \
            perl curl ca-certificates

      - name: Build Linux native libraries
        run: make native RIDS="linux-x64 linux-arm64"

      - name: Upload linux-x64 native lib
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: pjsua2.net/runtimes/linux-x64/native
          if-no-files-found: error

      - name: Upload linux-arm64 native lib
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: pjsua2.net/runtimes/linux-arm64/native
          if-no-files-found: error

      - name: Upload C# bindings
        uses: actions/upload-artifact@v4
        with:
          name: bindings
          path: pjsua2.net/bindings
          if-no-files-found: error

  build-windows:
    runs-on: windows

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          submodules: recursive

      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc
            make
            swig
            perl
            curl
            tar

      - name: Build Windows native libraries
        shell: msys2 {0}
        run: make native RIDS="win-x64 win-x86"

      - name: Upload win-x64 native lib
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: pjsua2.net/runtimes/win-x64/native
          if-no-files-found: error

      - name: Upload win-x86 native lib
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x86
          path: pjsua2.net/runtimes/win-x86/native
          if-no-files-found: error

  pack-publish:
    needs: [build-linux, build-windows]
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download linux-x64 native lib
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: pjsua2.net/runtimes/linux-x64/native

      - name: Download linux-arm64 native lib
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: pjsua2.net/runtimes/linux-arm64/native

      - name: Download win-x64 native lib
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: pjsua2.net/runtimes/win-x64/native

      - name: Download win-x86 native lib
        uses: actions/download-artifact@v4
        with:
          name: native-win-x86
          path: pjsua2.net/runtimes/win-x86/native

      - name: Download C# bindings
        uses: actions/download-artifact@v4
        with:
          name: bindings
          path: pjsua2.net/bindings

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version from tag
        shell: bash
        run: |
          TAG_NAME="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}"

          if [ -z "${TAG_NAME}" ]; then
            echo "No tag provided."
            exit 1
          fi

          PACKAGE_VERSION="${TAG_NAME#v}"

          if ! [[ "${PACKAGE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${TAG_NAME}' does not map to a valid SemVer package version."
            exit 1
          fi

          echo "TAG_NAME=${TAG_NAME}" >> "${GITHUB_ENV}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${GITHUB_ENV}"
          echo "Publishing package version ${PACKAGE_VERSION} from tag ${TAG_NAME}."

      - name: Restore
        run: dotnet restore pjsua2.net/codecrush.pjsua2.csproj

      - name: Build
        run: dotnet build pjsua2.net/codecrush.pjsua2.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack pjsua2.net/codecrush.pjsua2.csproj -c Release --no-build -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Push package to NuGet.org
        env:
          PUBLIC_NUGET_API_KEY: ${{ secrets.PUBLIC_NUGET_API_KEY }}
        shell: bash
        run: |
          if [ -z "${PUBLIC_NUGET_API_KEY}" ]; then
            echo "PUBLIC_NUGET_API_KEY secret is not set."
            exit 1
          fi

          dotnet nuget push "pjsua2.net/bin/Release/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${PUBLIC_NUGET_API_KEY}" \
            --skip-duplicate
